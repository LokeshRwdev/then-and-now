<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFECE6"/>
      <stop offset="100%" stop-color="#E2DDD5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D5CFBE" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Minimalist Craft Icon -->
  <g transform="translate(400, 270)" stroke="#8C827A" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Frame -->
    <rect x="-45" y="-35" width="90" height="70" rx="3" stroke="#8C827A" stroke-opacity="0.6"/>
    <!-- Hill / Landscape lines -->
    <path d="M -45 15 L -20 -10 L 5 15 L 20 0 L 45 25" stroke="#8C827A" stroke-opacity="0.7"/>
    <circle cx="15" cy="-12" r="6" stroke="#8C827A" stroke-opacity="0.7"/>
  </g>

  <!-- Typography -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#6B625B" text-transform="uppercase">
    THEN &amp; NOW
  </text>
  <text x="400" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" letter-spacing="2" fill="#998E84">
    IMAGE PLACEHOLDER
  </text>
</svg>
